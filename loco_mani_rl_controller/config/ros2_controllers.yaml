# ros2_control controller graph for the D1 + Piper-L loco-manipulation policy.
# Each command interface is exposed as a separate forward controller because
# the policy publishes position, velocity, effort, kp and kd arrays together.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 500
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      imu_sensor_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
      loco_mani_position_controller:
        type: forward_command_controller/ForwardCommandController
      loco_mani_velocity_controller:
        type: forward_command_controller/ForwardCommandController
      loco_mani_effort_controller:
        type: forward_command_controller/ForwardCommandController
      loco_mani_kp_controller:
        type: forward_command_controller/ForwardCommandController
      loco_mani_kd_controller:
        type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    update_rate: 500
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FL_foot_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FR_foot_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RL_foot_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RR_foot_joint
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

imu_sensor_broadcaster:
  ros__parameters:
    update_rate: 500
    sensor_name: trunk_imu
    frame_id: imu_link

loco_mani_position_controller:
  ros__parameters:
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FL_foot_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FR_foot_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RL_foot_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RR_foot_joint
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: position

loco_mani_velocity_controller:
  ros__parameters:
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FL_foot_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FR_foot_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RL_foot_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RR_foot_joint
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: velocity

loco_mani_effort_controller:
  ros__parameters:
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FL_foot_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FR_foot_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RL_foot_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RR_foot_joint
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: effort

loco_mani_kp_controller:
  ros__parameters:
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FL_foot_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FR_foot_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RL_foot_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RR_foot_joint
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: kp

