safety:
  enable_on_start: false
  dry_run: true
  state_timeout_ms: 20
  command_timeout_ms: 40
  max_tilt_deg: 35
  min_base_height_m: 0.25
  # Current D1 CAN feedback has no validated world-referenced base-height
  # source. Keep this false until a measured estimator/source is integrated;
  # setting it true without one fails closed.
  base_height_check_enabled: false
  # The exported policy is not guaranteed to be normalized to [-1, 1]; the
  # adapter still applies per-joint position/velocity/torque limits.
  max_action_abs: 10.0
  max_torque_rate_nm_s: 300.0
  require_estop_clear: true

# Runtime adapter notes:
# - The Python process must import d1_piper_hardware.py and inject a validated
#   D1Api wrapper around libtita_robot (the C++ ABI is not guessed here).
# - Piper is created with pyAgxArm(robot=piper_l, channel=can1). Firmware
#   profile 'auto' probes get_firmware() before selecting default/v183/v188/v189.
# - Keep dry_run=true until the acceptance gates in docs/implementation_plan.md
#   are completed; no launch file in this repository enables either bus.
